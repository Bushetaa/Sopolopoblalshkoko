<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sopo Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-stage {
            width: 400px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(14, 165, 233, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 40%, transparent 100%);
        }

        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .ag1 {
            width: 200px;
            height: 200px;
            background: rgba(14, 165, 233, 0.12);
            top: 20%;
            left: 20%;
            animation: drift1 8s ease-in-out infinite;
        }

        .ag2 {
            width: 180px;
            height: 180px;
            background: rgba(139, 92, 246, 0.1);
            bottom: 15%;
            right: 18%;
            animation: drift2 10s ease-in-out infinite;
        }

        @keyframes drift1 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(20px, -15px)
            }
        }

        @keyframes drift2 {

            0%,
            100% {
                transform: translate(0, 0)
            }

            50% {
                transform: translate(-15px, 20px)
            }
        }

        .logo-core {
            position: relative;
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .pipeline.right {
            align-items: flex-start;
        }

        .pipe-track {
            position: relative;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .pipeline.left .pipe-track:nth-child(1) {
            width: 44px;
        }

        .pipeline.left .pipe-track:nth-child(2) {
            width: 60px;
        }

        .pipeline.left .pipe-track:nth-child(3) {
            width: 36px;
        }

        .pipeline.right .pipe-track:nth-child(1) {
            width: 36px;
        }

        .pipeline.right .pipe-track:nth-child(2) {
            width: 60px;
        }

        .pipeline.right .pipe-track:nth-child(3) {
            width: 44px;
        }

        .pipe-fill {
            position: absolute;
            inset: 0;
            border-radius: 2px;
            animation: pipe-flow 2s linear infinite;
            background: linear-gradient(90deg, transparent, #0ea5e9, transparent);
        }

        .pipeline.right .pipe-fill {
            background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
            animation-direction: reverse;
        }

        .pipe-track:nth-child(1) .pipe-fill {
            animation-delay: 0s;
        }

        .pipe-track:nth-child(2) .pipe-fill {
            animation-delay: 0.4s;
        }

        .pipe-track:nth-child(3) .pipe-fill {
            animation-delay: 0.8s;
        }

        @keyframes pipe-flow {
            0% {
                transform: translateX(-100%)
            }

            100% {
                transform: translateX(200%)
            }
        }

        .node-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 12px;
        }

        .node-ring {
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.5), rgba(139, 92, 246, 0.5));
            transform: rotate(45deg);
            animation: ring-pulse 3s ease-in-out infinite;
        }

        @keyframes ring-pulse {

            0%,
            100% {
                opacity: 0.5;
                transform: rotate(45deg) scale(1);
            }

            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.04);
            }
        }

        .node-body {
            position: absolute;
            inset: 1px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            transform: rotate(45deg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .corner-dot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: dot-blink 2s ease-in-out infinite;
        }

        .cd-tl {
            top: -3px;
            left: -3px;
            background: #0ea5e9;
            box-shadow: 0 0 6px #0ea5e9;
            animation-delay: 0s;
        }

        .cd-tr {
            top: -3px;
            right: -3px;
            background: #8b5cf6;
            box-shadow: 0 0 6px #8b5cf6;
            animation-delay: 0.5s;
        }

        .cd-bl {
            bottom: -3px;
            left: -3px;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation-delay: 1s;
        }

        .cd-br {
            bottom: -3px;
            right: -3px;
            background: #0ea5e9;
            box-shadow: 0 0 6px #0ea5e9;
            animation-delay: 1.5s;
        }

        @keyframes dot-blink {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: 0.3;
                transform: scale(0.7)
            }
        }

        .slash-symbol {
            position: relative;
            z-index: 3;
            font-family: 'Fira Code', monospace;
            font-size: 2.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1px;
            line-height: 1;
        }

        .brace-l {
            color: #10b981;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.7));
        }

        .slash-mark {
            color: #fff;
            animation: slash-glow 2.5s ease-in-out infinite alternate;
        }

        .brace-r {
            color: #0ea5e9;
            filter: drop-shadow(0 0 8px rgba(14, 165, 233, 0.7));
        }

        @keyframes slash-glow {
            0% {
                color: #fff;
                filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
            }

            100% {
                color: #8b5cf6;
                filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.9));
            }
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(14, 165, 233, 0.4), transparent);
            animation: scan 5s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                top: -2px;
                opacity: 0
            }

            5% {
                opacity: 1
            }

            95% {
                opacity: 0.5
            }

            100% {
                top: 100%;
                opacity: 0
            }
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .pt {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            animation: float-pt linear infinite;
            opacity: 0;
        }

        @keyframes float-pt {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-120px) translateX(20px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="logo-stage">
        <div class="grid-bg"></div>
        <div class="scan-line"></div>
        <div class="ambient-glow ag1"></div>
        <div class="ambient-glow ag2"></div>
        <div class="particles" id="pts"></div>

        <div class="logo-core">
            <div class="pipeline left">
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
            </div>

            <div class="node-wrap">
                <div class="node-ring"></div>
                <div class="node-body"></div>
                <div class="corner-dot cd-tl"></div>
                <div class="corner-dot cd-tr"></div>
                <div class="corner-dot cd-bl"></div>
                <div class="corner-dot cd-br"></div>
                <div class="slash-symbol">
                    <span class="brace-l">&lt;</span><span class="slash-mark">/</span><span class="brace-r">&gt;</span>
                </div>
            </div>

            <div class="pipeline right">
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
                <div class="pipe-track">
                    <div class="pipe-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const c = document.getElementById('pts');
        const colors = ['#0ea5e9', '#8b5cf6', '#10b981'];
        for (let i = 0; i < 16; i++) {
            const p = document.createElement('div');
            p.className = 'pt';
            p.style.cssText = `left:${Math.random() * 100}%;bottom:${Math.random() * 30}%;background:${colors[i % 3]};animation-duration:${4 + Math.random() * 6}s;animation-delay:${Math.random() * 6}s;`;
            c.appendChild(p);
        }
    </script>
</body>

</html>
